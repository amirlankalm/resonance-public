[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-rl"
version = "0.1.0"
description = "Resonance: Reinforcement Learning and Active Experimentation Environment for Physics Reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Harriot Resonance Team"}
]
keywords = ["physics", "reinforcement-learning", "scientific-reasoning", "spectroscopy", "active-learning", "gymnasium"]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "gymnasium>=0.29.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "hypothesis>=6.80.0",
    "matplotlib>=3.7.0",
    "sympy>=1.12",
]
docs = [
    "mkdocs>=1.5.0",
]

[project.scripts]
resonance = "resonance.cli:main"

[tool.setuptools.packages.find]
include = ["resonance*"]
